# @package _global_
defaults:
  - /model: SFQ
  - /trainer: default
  - /hydra: default
  - /callbacks: sfq_overfit
  - /data: multibone_fragments
  - _self_

project_name: e25_sfq_area64
experiment_name: r0_overfit32
seed: 42

data:
  data_root_sim: ${oc.env:PENGWIN_ROOT,.}/Dataset/PENGWIN26_task3_simulation_fractures_train/points
  data_type: simu
  sim2clinic_enabled: true
  qsmall_hard_ratio: 1.0
  proposal_ratio: 0.0
  replay_ratio: 0.0
  random_anchor: true
  merge_prob: 0.15
  frac_prob: 0.70
  drop_prob: 0.0
  region_dropout_prob: 0.0
  point_jitter_std: 0.0
  fixed_train_seed_base: 20260820
  fixed_train_pose_mode: qsmall_hard
  train_subset_size: 32
  val_subset_size: 32
  val_from_train_subset: true
  batch_size: 8
  num_workers: 4

model:
  variant: r0
  optimizer:
    lr: 2.0e-4

trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  precision: 16-mixed
  max_epochs: 100
  check_val_every_n_epoch: 1
  overfit_batches: 4
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  default_root_dir: ${oc.env:PENGWIN_ROOT,.}/Model/e25_sfq_area64_20260820/r0_overfit32_seed${seed}

ckpt_path: null
