# @package _global_
defaults:
  - /model: SFQ
  - /trainer: default
  - /hydra: default
  - /callbacks: sfq_formal
  - /data: multibone_fragments
  - _self_

project_name: e25_sfq_area64
experiment_name: sfq_branch3_ddp4
seed: 42

data:
  data_root_sim: ${oc.env:PENGWIN_ROOT,.}/Dataset/PENGWIN26_task3_simulation_fractures_train/points
  data_type: simu
  sim2clinic_enabled: true
  qsmall_hard_ratio: 0.30
  proposal_ratio: 0.0
  replay_ratio: 0.10
  hard_pool_size: 20000
  hard_pool_per_bucket: 256
  hard_pool_age_decay: 0.08
  initial_hard_pool_paths:
    - ${oc.env:OHM_HARD_POOL_RANK0}
    - ${oc.env:OHM_HARD_POOL_RANK1}
  random_anchor: true
  merge_prob: 0.15
  frac_prob: 0.70
  drop_prob: 0.10
  region_dropout_prob: 0.10
  point_jitter_std: 0.002
  batch_size: 6
  num_workers: 12

model:
  variant: r0
  optimizer:
    lr: 2.0e-4

trainer:
  accelerator: gpu
  devices: 4
  strategy: ddp_find_unused_parameters_false
  precision: 16-mixed
  max_epochs: 3
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  log_every_n_steps: 20
  num_sanity_val_steps: 0
  default_root_dir: ${oc.env:PENGWIN_ROOT,.}/Model/e25_sfq_area64_20260820/branch3_${model.variant}_ddp4

ckpt_path: null
