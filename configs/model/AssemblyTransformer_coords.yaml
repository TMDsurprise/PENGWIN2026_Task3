# ==============================================================================
# Global Lightning Module Configuration
# ==============================================================================
_target_: models.AssemblyNet.lightning_module.AssemblyLightningModule
output_type: "coords"  # Mode switch: "coords" or "pose"
save_vis_path: ./output/${experiment_name}

# Training mode: "full" for standard training, "lora" for LoRA fine-tuning
training_mode: "full"

# Path to pretrained checkpoints for LoRA fine-tuning (null = train from scratch)
checkpoint: null
lora_rank: 16
lora_alpha: 32.0

# Online hard-example mining is disabled for the clean baseline config.
hard_mining_enabled: false
hard_loss_weight: 0.30
hard_warmup_epochs: 1
anti_forgetting_enabled: false
anti_forgetting_mode: teacher
anti_forgetting_weight: 0.05
anti_forgetting_every_n_steps: 4
anti_forgetting_warmup_epochs: 2.0

# e26 fragment-balanced backbone additions. Disabled by default so legacy
# checkpoints and configurations remain behaviorally identical.
reliability_loss_weight: 0.0
reliability_coord_blend: 0.0
reliability_error_temperature_mm: 5.0
reliability_uniform_floor: 0.25
qsmall_adapter_lr: 2.0e-4
qsmall_trainable_last_layers: 4
qsmall_train_coordinate_head: true

# ------------------------------------------------------------------------------
# Core Transformer Architecture Configuration
# (Corresponds to the 'transformer_model' parameter in __init__)
# ------------------------------------------------------------------------------
transformer_model:
  _target_: models.AssemblyNet.transformer.AssemblyTransformer
  max_parts: 50
  embed_dim: 384
  num_layers: 12
  num_heads: 8
  dropout_rate: 0.0
  output_type: ${..output_type}
  fragment_context_enabled: false
  fragment_context_start_layer: 8
  fragment_context_dim: 192
  fragment_context_heads: 4
  point_reliability_enabled: false

# ------------------------------------------------------------------------------
# Optimizer Configuration
# (_partial_: True defers instantiation until network parameters are ready)
# ------------------------------------------------------------------------------
optimizer:
  _target_: torch.optim.AdamW
  _partial_: True
  lr: 1e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
