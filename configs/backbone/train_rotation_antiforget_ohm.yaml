# @package _global_
defaults:
  - /model: AssemblyTransformer_coords
  - /trainer: default
  - /hydra: default
  - /callbacks: default
  - /data: multibone_fragments
  - _self_

project_name: rotation_antiforget_ohm_ra
experiment_name: rotation_e19_legacy_ohm_full_ra_aux_ddp2_v1
seed: 42

data:
  data_root_sim: ${oc.env:PENGWIN_ROOT,.}/Dataset/PENGWIN26_task3_simulation_fractures_train/points
  data_type: simu
  sim2clinic_enabled: true
  proposal_ratio: 0.20
  replay_ratio: 0.10
  hard_pool_size: 20000
  hard_pool_per_bucket: 256
  random_anchor: true
  merge_prob: 0.15
  frac_prob: 0.70
  drop_prob: 0.10
  region_dropout_prob: 0.10
  point_jitter_std: 0.002
  batch_size: 4
  num_workers: 6

model:
  checkpoint: ${oc.env:RA_CHECKPOINT}
  save_vis_path: ${oc.env:PENGWIN_ROOT,.}/Model/rotation_antiforget_ohm_ra/formal_ddp2_ra_v1
  hard_mining_enabled: true
  hard_loss_weight: 0.30
  hard_warmup_epochs: 1
  anti_forgetting_enabled: true
  anti_forgetting_mode: rotation_teacher
  anti_forgetting_weight: 0.020
  anti_forgetting_every_n_steps: 4
  anti_forgetting_warmup_epochs: 1.0
  rotation_teacher_margin_deg: 0.25
  rotation_teacher_max_error_deg: 15.0
  rotation_aware_enabled: true
  rotation_warmup_epochs: 1
  fragment_balanced_weight: 0.25
  centered_weight: 0.010
  pair_weight: 0.004
  covariance_weight: 0.005
  horn_rot_weight: 0.010
  horn_trans_weight: 0.0015
  rotation_reference_deg: 10.0
  translation_reference_mm: 50.0
  paired_points_per_fragment: 24
  paired_max_pairs: 96
  horn_observability_floor: 0.05
  schedule_warmup_epochs: 0.5
  schedule_decay_epochs: 15.0
  schedule_initial_lr_ratio: 0.10
  schedule_min_lr_ratio: 0.05
  optimizer:
    lr: 1.0e-5

trainer:
  devices: 2
  strategy: ddp_find_unused_parameters_false
  precision: 16-mixed
  max_epochs: 1000
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 3
  gradient_clip_val: 0.5
  log_every_n_steps: 20
  default_root_dir: ${oc.env:PENGWIN_ROOT,.}/Model/rotation_antiforget_ohm_ra/formal_ddp2_ra_v1

callbacks:
  model_checkpoint:
    dirpath: ${oc.env:PENGWIN_ROOT,.}/Model/rotation_antiforget_ohm_ra/formal_ddp2_ra_v1/checkpoints
    filename: "epoch-{epoch}"
    monitor: val/loss
    mode: min
    save_top_k: 4
    save_last: true
    save_on_train_epoch_end: false
  early_stopping:
    monitor: val/loss
    mode: min
    patience: 10
    min_delta: 0.0000001
  training_log:
    log_dir: ${oc.env:PENGWIN_ROOT,.}/Model/rotation_antiforget_ohm_ra/formal_ddp2_ra_v1
  ema:
    _target_: callbacks.ema.EMAWeights
    decay: 0.999
    update_after_step: 50
    validate_with_ema: true

ckpt_path: null
